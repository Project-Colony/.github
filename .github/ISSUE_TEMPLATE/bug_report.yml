# Default bug report for every Project Colony repository that has no
# .github/ISSUE_TEMPLATE of its own. A repository that needs app-specific
# fields (log paths, install channels) ships its own form instead.
name: Bug report
description: Something is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search the existing
        issues first.

        A security problem never goes in a public issue: report it privately,
        as described in the [security policy](https://github.com/Project-Colony/.github/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Version
      description: The app's version (from `--version`, the About page or the release tag), or the commit you built.
      placeholder: "0.4.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Linux is the supported platform; Windows and macOS builds are best-effort, and reports from them are welcome.
      options:
        - Linux (x86_64)
        - Linux (aarch64)
        - Windows (x86_64)
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Other
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Distribution or OS version
      description: For example "Arch Linux, kernel 6.17, KDE Plasma 6.5 on Wayland", "Windows 11 25H2" or "macOS 26.1".
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Colony launcher
        - Release download from GitHub
        - AUR
        - Nix
        - Built from source
        - Other
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened instead?
      description: Include the exact error message, if there is one.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app.
        2. Click on ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant terminal output or log lines. Remove personal paths, tokens and passwords before pasting.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
        - label: I am on the latest release, or I say above why I am not.
          required: true
