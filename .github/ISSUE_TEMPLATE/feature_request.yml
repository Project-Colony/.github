# Default feature request for every Project Colony repository that has no
# .github/ISSUE_TEMPLATE of its own.
name: Feature request
description: Suggest a new capability or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Each Colony app does one thing well, so a request
        that keeps the app focused is the easiest one to accept. For a large
        change, agree on the approach here before you write the code.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The missing capability or the pain point, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should the app do?
      description: The behaviour you would like, from the user's side.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds, and why the one above is better.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues and found no duplicate.
          required: true
